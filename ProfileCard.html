<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      h2 {
        color: var(--primary);
        text-decoration: underline;
      }
      .profile-card {
        border-radius: 12px;
        width: 300px;
        padding: 20px;
        box-shadow: 0 0 20px rgb(7, 7, 174);
        transition: 0.5s;
      }
      .profile-card:hover {
        transform: scale(1.02);
      }
      img {
        width: 100px;
        border: 2px solid rgb(180, 215, 234);
        border-radius: 50%;
        display: block;
        margin: 0 auto;
      }

      @media (max-width: 600px) {
        .profile-card {
          width: 90%;
        }
      }
    </style>
  </head>
  <body>
    <article class="profile-card">
      <h2>Lakshit Shekhawat</h2>
      <img src="logo.png" alt="image" />
      <p>
        Lorem ipsum dolor sit amet consectetur, adipisicing elit. Aliquam
        molestiae corporis assumenda quod velit molestias laboriosam iusto
        similique, ipsa fuga.
      </p>
      <ul>
        <li>Lorem, ipsum dolor.</li>
        <li>Lorem, ipsum dolor.</li>
        <li>Lorem, ipsum dolor.</li>
      </ul>
      <a href="mailto:lakshit031@gmail.com">Mail</a>
    </article>
  </body>
</html>
