<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API CALL</title>
  </head>
  <body>
    <h2>Promise.all() Demo</h2>

    <button onclick="loadData()">Load Data</button>
    <div id="output"></div>

    <script>
      function loadData() {
        const output = document.getElementById("output");
        output.innerHTML = "Loading...";

        const UserAPI = fetch(
          "https://jsonplaceholder.typicode.com/users/1",
        ).then((response) => response.json());

        const PostAPI = fetch(
          "https://jsonplaceholder.typicode.com/posts/1",
        ).then((response) => response.json());

        const CommentsAPI = fetch(
          "https://jsonplaceholder.typicode.com/comments/1",
        ).then((response) => response.json());

        Promise.allSettled([UserAPI, PostAPI, CommentsAPI]).then((results) => {
          console.log(results);

          const [userResult, postResult, commentsResult] = results;
          output.innerHTML = `
                <h3>User</h3>
                <p>Name: ${userResult.value.name}</p>
                <h3>Post</h3>
                <p>Title: ${postResult.value.title}</p>
                <h3>Comment</h3>
                <p>Name: ${commentsResult.value.name}</p>
            `;
        });
      }
      
    </script>
  </body>
</html>
